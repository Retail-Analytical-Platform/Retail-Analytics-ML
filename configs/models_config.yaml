seed: 42
early_stopping_rounds: 50
n_trials: 10

models:
  catboost:
    params: {iterations: 1000, learning_rate: 0.05, depth: 6, l2_leaf_reg: 3}
    sample_params: {iterations: 30, thread_count: 1}
    search_space:
      learning_rate: [log_float, 0.01, 0.2]
      depth: [int, 4, 8]
      l2_leaf_reg: [float, 1.0, 10.0]
  lightgbm:
    params: {n_estimators: 1000, learning_rate: 0.05, num_leaves: 31, max_depth: 6, min_child_samples: 20}
    sample_params: {n_estimators: 30, n_jobs: 1}
    search_space:
      learning_rate: [log_float, 0.01, 0.2]
      num_leaves: [int, 15, 63]
      max_depth: [int, 3, 8]
      min_child_samples: [int, 10, 50]
  xgboost:
    params: {n_estimators: 1000, learning_rate: 0.05, max_depth: 6, min_child_weight: 1}
    sample_params: {n_estimators: 30, n_jobs: 1}
    search_space:
      learning_rate: [log_float, 0.01, 0.2]
      max_depth: [int, 3, 8]
      min_child_weight: [int, 1, 10]